<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Generator</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 50%, #fef9f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Lightning border container */
    .lightning-frame {
      position: relative;
      padding: 4px;
      border-radius: 28px;
      background: linear-gradient(90deg, #f7c948, #ff8c00, #ffe066, #ff6a00, #f7c948);
      background-size: 300% 100%;
      animation: lightningBorder 2.5s linear infinite;
      box-shadow:
        0 0 18px 4px rgba(247,201,72,0.55),
        0 0 40px 8px rgba(255,140,0,0.25);
    }
    @keyframes lightningBorder {
      0%   { background-position: 0% 50%; box-shadow: 0 0 18px 4px rgba(247,201,72,0.55), 0 0 40px 8px rgba(255,140,0,0.25); }
      25%  { background-position: 100% 50%; box-shadow: 0 0 30px 8px rgba(255,220,50,0.85), 0 0 60px 16px rgba(255,140,0,0.4); }
      50%  { background-position: 200% 50%; box-shadow: 0 0 18px 4px rgba(247,201,72,0.55), 0 0 40px 8px rgba(255,140,0,0.25); }
      75%  { background-position: 300% 50%; box-shadow: 0 0 30px 8px rgba(255,220,50,0.85), 0 0 60px 16px rgba(255,140,0,0.4); }
      100% { background-position: 400% 50%; box-shadow: 0 0 18px 4px rgba(247,201,72,0.55), 0 0 40px 8px rgba(255,140,0,0.25); }
    }

    /* Lightning bolt corner accents */
    .lightning-frame::before,
    .lightning-frame::after {
      content: '⚡';
      position: absolute;
      font-size: 22px;
      animation: boltFlicker 1.8s ease-in-out infinite;
      filter: drop-shadow(0 0 6px #f7c948);
    }
    .lightning-frame::before { top: -14px; left: -10px; transform: rotate(-15deg); }
    .lightning-frame::after  { bottom: -14px; right: -10px; transform: rotate(165deg); animation-delay: 0.9s; }
    @keyframes boltFlicker {
      0%,100% { opacity:1; filter: drop-shadow(0 0 6px #f7c948); }
      45%      { opacity:0.4; filter: drop-shadow(0 0 2px #f7c948); }
      50%      { opacity:1; filter: drop-shadow(0 0 14px #fff176); }
      55%      { opacity:0.7; }
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 44px 38px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .bolt-title {
      font-size: 2rem;
      filter: drop-shadow(0 0 8px #f7c948);
      animation: boltFlicker 2s ease-in-out infinite;
    }
    h1 { color: #1a1a2e; font-size: 1.75rem; font-weight: 700; }

    .subtitle { color: #6b7280; font-size: .88rem; margin-bottom: 28px; margin-top: 6px; }

    .size-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .size-row label { color: #374151; font-size: .85rem; font-weight: 500; }
    .size-row select {
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #111827;
      padding: 6px 12px;
      font-size: .85rem;
      outline: none;
      cursor: pointer;
    }

    .input-group { display:flex; gap:10px; margin-bottom:8px; }
    input[type=text] {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1.5px solid #d1d5db;
      background: #f9fafb;
      color: #111827;
      font-size: .93rem;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    input[type=text]::placeholder { color: #9ca3af; }
    input[type=text]:focus { border-color: #f59e0b; background: #fffbeb; }

    #generateBtn {
      padding: 13px 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: .93rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s, box-shadow .15s;
    }
    #generateBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(245,158,11,0.5); }

    .error-msg { color: #dc2626; font-size: .82rem; min-height: 18px; text-align:left; padding-left:4px; margin-bottom:4px; }

    .qr-wrapper { display:none; flex-direction:column; align-items:center; gap:18px; margin-top:8px; animation: fadeIn .4s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .divider { border:none; border-top:1px solid #e5e7eb; width:100%; margin:4px 0; }

    /* QR box with lightning border */
    .qr-box-wrap {
      position: relative;
      padding: 3px;
      border-radius: 14px;
      background: linear-gradient(90deg,#f7c948,#ff8c00,#ffe066,#ff6a00,#f7c948);
      background-size: 300% 100%;
      animation: lightningBorder 2.5s linear infinite;
      box-shadow: 0 0 20px 4px rgba(247,201,72,0.4), 0 4px 24px rgba(0,0,0,0.12);
    }
    .qr-box { background:#fff; padding:14px; border-radius:12px; display:inline-block; position:relative; }
    canvas { display:block; }

    .url-label { color: #6b7280; font-size:.78rem; word-break:break-all; max-width:380px; line-height:1.5; }
    .url-label span { color: #d97706; font-weight:600; }

    .actions { display:flex; gap:10px; }
    .btn-secondary {
      padding: 10px 20px; border-radius: 10px;
      border: 1.5px solid #d1d5db;
      background: #f9fafb; color: #374151;
      font-size: .87rem; font-weight: 500; cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .btn-secondary:hover { background: #f3f4f6; border-color: #9ca3af; }
    .btn-download {
      padding: 10px 20px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff; font-size: .87rem; font-weight: 700;
      cursor: pointer; transition: transform .15s, box-shadow .15s;
    }
    .btn-download:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(245,158,11,0.4); }
  </style>
</head>
<body>
<div class="lightning-frame">
<div class="card">
  <div class="logo-row">
    <span class="bolt-title">⚡</span>
    <h1>QR Code Generator</h1>
    <span class="bolt-title">⚡</span>
  </div>
  <p class="subtitle">Paste any URL to instantly generate a scannable QR code</p>

  <div class="size-row">
    <label for="qrSize">QR Code Size</label>
    <select id="qrSize">
      <option value="3">Small (~150px)</option>
      <option value="5" selected>Medium (~250px)</option>
      <option value="7">Large (~350px)</option>
      <option value="9">Extra Large (~450px)</option>
    </select>
  </div>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off"/>
    <button id="generateBtn" onclick="generateQR()">⚡ Generate</button>
  </div>
  <div class="error-msg" id="errorMsg"></div>

  <div class="qr-wrapper" id="qrWrapper">
    <div class="divider"></div>
    <div class="qr-box-wrap">
      <div class="qr-box">
        <canvas id="qrCanvas"></canvas>
      </div>
    </div>
    <p class="url-label">QR code for: <span id="urlDisplay"></span></p>
    <div class="actions">
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
      <button class="btn-download" onclick="downloadQR()">⬇ Download PNG</button>
    </div>
  </div>
</div>
</div>

<script>
// ============================================================
// Pure JS QR Code encoder — self-contained, no dependencies
// Based on public-domain QR spec implementation
// ============================================================

// --- Galois Field arithmetic for Reed-Solomon ---
var QR_ALPHANUMERIC = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:";

function QRCode(text, moduleSize) {
  this.text = text;
  this.moduleSize = moduleSize || 5;
  this.matrix = null;
  this.size = 0;
  this._generate();
}

QRCode.prototype._generate = function() {
  // Determine version (1-10 supported for byte mode)
  var data = encodeURIComponent(this.text).replace(/%../g, function(m){
    return String.fromCharCode(parseInt(m.slice(1),16));
  });
  // Use byte mode
  var bytes = [];
  for (var i=0;i<data.length;i++) bytes.push(data.charCodeAt(i)&0xff);
  
  // Pick version: capacity table for byte mode, error correction M
  // (max data bytes per version for M level)
  var cap = [0,16,28,44,64,86,108,124,154,182,216,254,290,334,365,415,453,507,563,627,669];
  var ver = 1;
  while (ver<=20 && cap[ver]<bytes.length) ver++;
  if (ver>20) { alert("URL too long for QR code"); return; }
  
  this.version = ver;
  var size = ver*4+17;
  this.size = size;
  
  // Build matrix
  var mat = [];
  for (var r=0;r<size;r++){mat.push([]);for(var c=0;c<size;c++)mat[r].push(-1);}
  
  // Finder patterns
  function setFinder(mat,r,c){
    for(var dr=-1;dr<=7;dr++)for(var dc=-1;dc<=7;dc++){
      var nr=r+dr,nc=c+dc;
      if(nr<0||nr>=mat.length||nc<0||nc>=mat.length)continue;
      var v=0;
      if(dr>=0&&dr<=6&&(dc===0||dc===6))v=1;
      else if(dc>=0&&dc<=6&&(dr===0||dr===6))v=1;
      else if(dr>=2&&dr<=4&&dc>=2&&dc<=4)v=1;
      mat[nr][nc]=v;
    }
  }
  setFinder(mat,0,0);
  setFinder(mat,0,size-7);
  setFinder(mat,size-7,0);
  
  // Separators already 0 from finder boundary
  
  // Timing patterns
  for(var i=8;i<size-8;i++){
    mat[6][i]=(i%2===0)?1:0;
    mat[i][6]=(i%2===0)?1:0;
  }
  
  // Dark module
  mat[size-8][8]=1;
  
  // Alignment patterns
  var alignPos=[
    [],[],[6,18],[6,22],[6,26],[6,30],[6,34],
    [6,22,38],[6,24,42],[6,26,46],[6,28,50],
    [6,30,54],[6,32,58],[6,34,62],[6,26,46,66],
    [6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],
    [6,30,58,86],[6,34,62,90]
  ];
  if(ver>=2){
    var pos=alignPos[ver];
    for(var ai=0;ai<pos.length;ai++)for(var aj=0;aj<pos.length;aj++){
      var ar=pos[ai],ac=pos[aj];
      if(mat[ar][ac]!==-1)continue;
      for(var dr2=-2;dr2<=2;dr2++)for(var dc2=-2;dc2<=2;dc2++){
        var v2=0;
        if(Math.abs(dr2)===2||Math.abs(dc2)===2)v2=1;
        else if(dr2===0&&dc2===0)v2=1;
        mat[ar+dr2][ac+dc2]=v2;
      }
    }
  }
  
  // Reserve format areas
  for(var i=0;i<9;i++){
    if(mat[8][i]===-1)mat[8][i]=0;
    if(mat[i][8]===-1)mat[i][8]=0;
  }
  for(var i=size-8;i<size;i++){
    if(mat[8][i]===-1)mat[8][i]=0;
    if(mat[i][8]===-1)mat[i][8]=0;
  }
  
  // Reed-Solomon
  function gfMul(a,b){
    if(a===0||b===0)return 0;
    return gfExp[(gfLog[a]+gfLog[b])%255];
  }
  var gfExp=new Uint8Array(512),gfLog=new Uint8Array(256);
  var x=1;
  for(var i=0;i<255;i++){gfExp[i]=x;gfLog[x]=i;x=x<<1;if(x&256)x^=285;}
  for(var i=255;i<512;i++)gfExp[i]=gfExp[i-255];
  
  function rsGenerator(n){
    var g=[1];
    for(var i=0;i<n;i++){
      var ng=[1,gfExp[i]];
      var res=new Array(g.length+1).fill(0);
      for(var j=0;j<g.length;j++)for(var k=0;k<ng.length;k++)res[j+k]^=gfMul(g[j],ng[k]);
      g=res;
    }
    return g;
  }
  
  // EC codewords per block for M level
  var ecTable=[
    null,
    {ec:10,b1:1,d1:16,b2:0,d2:0},
    {ec:16,b1:1,d1:28,b2:0,d2:0},
    {ec:26,b1:1,d1:44,b2:0,d2:0},
    {ec:18,b1:2,d1:32,b2:0,d2:0},
    {ec:24,b1:2,d1:43,b2:0,d2:0},
    {ec:16,b1:4,d1:27,b2:0,d2:0},
    {ec:18,b1:4,d1:31,b2:0,d2:0},
    {ec:22,b1:2,d1:38,b2:2,d2:39},
    {ec:22,b1:3,d1:36,b2:2,d2:37},
    {ec:26,b1:4,d1:43,b2:1,d2:44},
    {ec:30,b1:1,d1:50,b2:4,d2:51},
    {ec:22,b1:6,d1:36,b2:2,d2:37},
    {ec:22,b1:8,d1:37,b2:1,d2:38},
    {ec:24,b1:4,d1:40,b2:5,d2:41},
    {ec:24,b1:5,d1:41,b2:5,d2:42},
    {ec:28,b1:7,d1:45,b2:3,d2:46},
    {ec:28,b1:10,d1:46,b2:1,d2:47},
    {ec:26,b1:9,d1:43,b2:4,d2:44},
    {ec:26,b1:3,d1:44,b2:11,d2:45},
    {ec:26,b1:3,d1:41,b2:13,d2:42}
  ];
  
  var ec=ecTable[ver];
  
  // Build data codewords (byte mode)
  var modeIndicator=0x4; // byte mode
  var charCount=bytes.length;
  var ccBits=ver<10?8:16;
  
  var bits=[];
  function addBits(val,len){for(var i=len-1;i>=0;i--)bits.push((val>>i)&1);}
  addBits(modeIndicator,4);
  addBits(charCount,ccBits);
  for(var i=0;i<bytes.length;i++)addBits(bytes[i],8);
  
  // Terminator & padding
  var totalData=(ec.b1*ec.d1+ec.b2*ec.d2)*8;
  for(var i=0;i<4&&bits.length<totalData;i++)bits.push(0);
  while(bits.length%8!==0)bits.push(0);
  var pads=[0xEC,0x11];var pi=0;
  while(bits.length<totalData){addBits(pads[pi%2],8);pi++;}
  
  // Convert to bytes
  var dataCW=[];
  for(var i=0;i<bits.length;i+=8){
    var b=0;for(var j=0;j<8;j++)b=(b<<1)|bits[i+j];
    dataCW.push(b);
  }
  
  // Split into blocks and compute EC
  var blocks=[];
  var idx=0;
  for(var i=0;i<ec.b1;i++){blocks.push(dataCW.slice(idx,idx+ec.d1));idx+=ec.d1;}
  for(var i=0;i<ec.b2;i++){blocks.push(dataCW.slice(idx,idx+ec.d2));idx+=ec.d2;}
  
  var gen=rsGenerator(ec.ec);
  var ecBlocks=blocks.map(function(blk){
    var msg=blk.slice();
    for(var i=0;i<ec.ec;i++)msg.push(0);
    for(var i=0;i<blk.length;i++){
      var c=msg.shift();
      if(c===0)continue;
      for(var j=0;j<gen.length;j++)msg[j]^=gfMul(gen[j],c);
    }
    return msg;
  });
  
  // Interleave
  var final_=[];
  var maxD=Math.max(ec.d1,ec.d2);
  for(var i=0;i<maxD;i++)for(var b=0;b<blocks.length;b++)if(i<blocks[b].length)final_.push(blocks[b][i]);
  for(var i=0;i<ec.ec;i++)for(var b=0;b<ecBlocks.length;b++)final_.push(ecBlocks[b][i]);
  
  // Convert to bit stream
  var stream=[];
  for(var i=0;i<final_.length;i++)for(var j=7;j>=0;j--)stream.push((final_[i]>>j)&1);
  // Remainder bits
  var rem=[0,0,7,7,7,7,7,0,0,0,0,0,0,0,3,3,3,3,3,3,3][ver]||0;
  for(var i=0;i<rem;i++)stream.push(0);
  
  // Place data bits (zigzag)
  var si=0;
  function isReserved(r,c){return mat[r][c]!==-1;}
  var col=size-1;
  var goingUp=true;
  while(col>0){
    if(col===6)col--;
    for(var row2=0;row2<size;row2++){
      var r2=goingUp?size-1-row2:row2;
      for(var dc3=0;dc3<2;dc3++){
        var c2=col-dc3;
        if(!isReserved(r2,c2)){
          mat[r2][c2]=si<stream.length?stream[si++]:0;
        }
      }
    }
    goingUp=!goingUp;
    col-=2;
  }
  
  // Apply mask 0: (r+c)%2==0
  var maskPat=0; // mask pattern 0 is simple and works well
  // Try all 8 masks and pick best penalty — simplified: use mask 0
  function applyMask(mat,mask){
    var m=mat.map(function(r){return r.slice();});
    for(var r=0;r<size;r++)for(var c=0;c<size;c++){
      if(mat[r][c]===-1)continue;
      var cond=false;
      switch(mask){
        case 0:cond=(r+c)%2===0;break;
        case 1:cond=r%2===0;break;
        case 2:cond=c%3===0;break;
        case 3:cond=(r+c)%3===0;break;
        case 4:cond=(Math.floor(r/2)+Math.floor(c/3))%2===0;break;
        case 5:cond=(r*c)%2+(r*c)%3===0;break;
        case 6:cond=((r*c)%2+(r*c)%3)%2===0;break;
        case 7:cond=((r+c)%2+(r*c)%3)%2===0;break;
      }
      if(cond)m[r][c]^=1;
    }
    return m;
  }
  
  function penalty(m){
    var p=0,n=m.length;
    // Rule 1: 5+ same in a row/col
    for(var r=0;r<n;r++){
      var run=1;
      for(var c=1;c<n;c++){if(m[r][c]===m[r][c-1])run++;else{if(run>=5)p+=run-2;run=1;}}
      if(run>=5)p+=run-2;
    }
    for(var c=0;c<n;c++){
      var run=1;
      for(var r=1;r<n;r++){if(m[r][c]===m[r-1][c])run++;else{if(run>=5)p+=run-2;run=1;}}
      if(run>=5)p+=run-2;
    }
    // Rule 2: 2x2 blocks
    for(var r=0;r<n-1;r++)for(var c=0;c<n-1;c++){
      var v=m[r][c];if(v===m[r][c+1]&&v===m[r+1][c]&&v===m[r+1][c+1])p+=3;
    }
    return p;
  }
  
  var bestMat=null,bestP=Infinity;
  for(var mask=0;mask<8;mask++){
    var masked=applyMask(mat,mask);
    var p=penalty(masked);
    if(p<bestP){bestP=p;bestMat=masked;maskPat=mask;}
  }
  
  // Write format info
  // Format string for M error correction + mask
  var formatData=[
    0x77C4,0x72F3,0x7DAA,0x789D,0x662F,0x6318,0x6C41,0x6976, // M
  ];
  var fmt=formatData[maskPat];
  // Place format bits around finder patterns
  var fmtBits=[];
  for(var i=14;i>=0;i--)fmtBits.push((fmt>>i)&1);
  var fmtPos=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  for(var i=0;i<15;i++){bestMat[fmtPos[i][0]][fmtPos[i][1]]=fmtBits[i];}
  // Second copy
  for(var i=0;i<8;i++)bestMat[size-1-i][8]=fmtBits[i];
  for(var i=8;i<15;i++)bestMat[8][size-15+i]=fmtBits[i];
  bestMat[size-8][8]=1; // dark module
  
  this.matrix=bestMat;
};

QRCode.prototype.draw = function(canvas) {
  var ms=this.moduleSize;
  var s=this.size;
  canvas.width=(s+8)*ms;
  canvas.height=(s+8)*ms;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#000000';
  var off=4*ms;
  for(var r=0;r<s;r++)for(var c=0;c<s;c++){
    if(this.matrix[r][c]===1)ctx.fillRect(off+c*ms,off+r*ms,ms,ms);
  }
};

// Override draw to add lightning bolt overlay in center
QRCode.prototype.draw = function(canvas) {
  var ms = this.moduleSize;
  var s  = this.size;
  var off = 4 * ms;
  canvas.width  = (s + 8) * ms;
  canvas.height = (s + 8) * ms;
  var ctx = canvas.getContext('2d');

  // White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw QR modules in dark gold/charcoal instead of pure black for style
  ctx.fillStyle = '#1a1a2e';
  for (var r = 0; r < s; r++) {
    for (var c = 0; c < s; c++) {
      if (this.matrix[r][c] === 1) {
        ctx.fillRect(off + c * ms, off + r * ms, ms, ms);
      }
    }
  }

  // --- Lightning bolt logo overlay in center ---
  var cx = canvas.width  / 2;
  var cy = canvas.height / 2;
  var boltW = ms * 7;   // width of bolt badge
  var boltH = ms * 7;   // height of bolt badge
  var pad   = ms * 0.6;

  // White circle background so QR modules don't bleed through
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, boltW * 0.62, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  // Gold gradient circle
  var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, boltW * 0.58);
  grad.addColorStop(0,   '#fff9e6');
  grad.addColorStop(0.5, '#fde68a');
  grad.addColorStop(1,   '#f59e0b');
  ctx.beginPath();
  ctx.arc(cx, cy, boltW * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Thin amber ring
  ctx.beginPath();
  ctx.arc(cx, cy, boltW * 0.55, 0, Math.PI * 2);
  ctx.strokeStyle = '#d97706';
  ctx.lineWidth = ms * 0.18;
  ctx.stroke();
  ctx.restore();

  // Draw lightning bolt shape (polygon path)
  ctx.save();
  ctx.translate(cx, cy);
  var bw = boltW * 0.38;
  var bh = boltH * 0.72;
  // Classic lightning bolt: top-right to bottom-left with inner kink
  ctx.beginPath();
  ctx.moveTo( bw * 0.15, -bh * 0.5);   // top-left of upper segment
  ctx.lineTo( bw * 0.62, -bh * 0.5);   // top-right
  ctx.lineTo(-bw * 0.08,  bh * 0.06);  // mid-right
  ctx.lineTo( bw * 0.38,  bh * 0.06);  // mid inner
  ctx.lineTo(-bw * 0.62,  bh * 0.5);   // bottom-left
  ctx.lineTo(-bw * 0.1,  -bh * 0.0);   // mid-left
  ctx.lineTo(-bw * 0.38, -bh * 0.0);   // inner kink
  ctx.closePath();
  ctx.fillStyle = '#1a1a2e';
  ctx.fill();
  ctx.restore();
};

// ---- App logic ----
var urlInput   = document.getElementById('urlInput');
var errorMsg   = document.getElementById('errorMsg');
var qrWrapper  = document.getElementById('qrWrapper');
var canvas     = document.getElementById('qrCanvas');
var urlDisplay = document.getElementById('urlDisplay');

urlInput.addEventListener('keydown', function(e){ if(e.key==='Enter') generateQR(); });

function generateQR() {
  errorMsg.textContent = '';
  var raw = urlInput.value.trim();
  if (!raw) { errorMsg.textContent = 'Please enter a URL.'; return; }
  var url = raw;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try { new URL(url); } catch(e) { errorMsg.textContent = 'Please enter a valid URL.'; return; }

  var ms = parseInt(document.getElementById('qrSize').value) || 5;
  try {
    var qr = new QRCode(url, ms);
    if (!qr.matrix) { return; }
    qr.draw(canvas);
    urlDisplay.textContent = url;
    qrWrapper.style.display = 'flex';
  } catch(e) {
    errorMsg.textContent = 'Error generating QR code: ' + e.message;
    console.error(e);
  }
}

function clearAll() {
  urlInput.value = ''; errorMsg.textContent = '';
  qrWrapper.style.display = 'none';
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  urlInput.focus();
}

function downloadQR() {
  var a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'qrcode.png';
  a.click();
}
</script>
