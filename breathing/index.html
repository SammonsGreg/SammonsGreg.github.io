<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cosmic Breath</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #03040f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  #starCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  .ui-wrap {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center;
  }

  .title {
    color: #c8d8f8; font-size: 1.45rem; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    text-shadow: 0 0 24px rgba(150,190,255,0.7);
    margin-bottom: 4px;
  }
  .subtitle {
    color: rgba(160,190,255,0.4); font-size: .7rem;
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 18px;
  }

  /* ── Box shape ── */
  .box-wrap {
    position: relative; width: 300px; height: 300px;
  }
  .box-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 5;
  }
  #moonCanvas {
    position: absolute; inset: 12px;
    width: calc(100% - 24px); height: calc(100% - 24px);
    border-radius: 28px; z-index: 4; pointer-events: none;
  }

  /* Side labels */
  .side-label {
    position: absolute; z-index: 6; pointer-events: none;
    color: rgba(140,175,255,0.28); font-size: .6rem;
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    transition: color .5s, text-shadow .5s;
  }
  .side-label.lit {
    color: rgba(210,235,255,0.95);
    text-shadow: 0 0 10px rgba(160,210,255,1), 0 0 22px rgba(120,180,255,0.5);
  }
  .sl-top    { top: 4px;   left: 50%; transform: translateX(-50%); }
  .sl-right  { right: -2px; top: 50%; transform: translateY(-50%) rotate(90deg); }
  .sl-bottom { bottom: 4px; left: 50%; transform: translateX(-50%); }
  .sl-left   { left: -2px;  top: 50%; transform: translateY(-50%) rotate(-90deg); }

  .phase-label {
    position: absolute; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    color: rgba(200,225,255,0.9); font-size: .76rem;
    font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    white-space: nowrap; z-index: 6;
    text-shadow: 0 0 12px rgba(140,190,255,0.9);
  }

  /* ── Bottom controls ── */
  .bottom-row {
    display: flex; align-items: center; gap: 18px; margin-top: 20px;
  }
  .ring-wrap { position: relative; width: 62px; height: 62px; flex-shrink: 0; }
  .ring-wrap svg { position: absolute; inset: 0; }
  .ring-bg  { fill:none; stroke:rgba(100,140,255,0.12); stroke-width:5; }
  .ring-arc { fill:none; stroke:#7eb8ff; stroke-width:5; stroke-linecap:round;
              transform:rotate(-90deg); transform-origin:31px 31px; }
  .ring-num { position:absolute; inset:0; display:flex; align-items:center;
              justify-content:center; color:#b8d4ff; font-size:1.35rem; font-weight:700; }

  .controls { display:flex; flex-direction:column; align-items:center; gap:9px; }
  select.pattern-sel {
    background: rgba(10,18,70,0.75); border: 1px solid rgba(100,140,255,0.3);
    border-radius: 30px; color: #b0ccff; font-size: .73rem;
    padding: 6px 14px; outline: none; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  select.pattern-sel option { background: #0a1240; }
  .btn-start {
    padding: 10px 30px; border-radius: 50px;
    border: 1.5px solid rgba(120,170,255,0.45);
    background: linear-gradient(135deg, rgba(35,70,190,0.65), rgba(70,35,170,0.65));
    color: #ccdeff; font-size: .86rem; font-weight: 700;
    letter-spacing: 1.5px; cursor: pointer; text-transform: uppercase;
    transition: box-shadow .2s, transform .15s; backdrop-filter: blur(4px);
  }
  .btn-start:hover { box-shadow: 0 0 20px rgba(100,150,255,0.5); transform: translateY(-1px); }
  .complete-msg {
    margin-top: 12px; color: rgba(180,215,255,0.6);
    font-size: .73rem; letter-spacing: 1px; min-height: 16px; text-align: center;
  }
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<div class="ui-wrap">
  <div class="title">Cosmic Breath</div>
  <div class="subtitle">breathe with the universe</div>

  <div class="box-wrap">
    <!-- Glowing border -->
    <svg class="box-svg" viewBox="0 0 300 300" id="boxSvg">
      <defs>
        <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#90c4ff"/>
          <stop offset="50%" stop-color="#c0aaff"/>
          <stop offset="100%" stop-color="#90c4ff"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect x="8" y="8" width="284" height="284" rx="34" ry="34"
            fill="none" stroke="rgba(70,110,240,0.14)" stroke-width="2.5"/>
      <rect x="8" y="8" width="284" height="284" rx="34" ry="34"
            fill="none" stroke="url(#traceGrad)" stroke-width="3"
            stroke-linecap="round" filter="url(#glow)" id="traceRect"/>
    </svg>

    <canvas id="moonCanvas"></canvas>

    <div class="side-label sl-top"    id="sl0">Inhale</div>
    <div class="side-label sl-right"  id="sl1">Hold</div>
    <div class="side-label sl-bottom" id="sl2">Exhale</div>
    <div class="side-label sl-left"   id="sl3">Hold</div>
    <div class="phase-label" id="phaseLabel">Ready to begin</div>
  </div>

  <div class="bottom-row">
    <div class="ring-wrap">
      <svg viewBox="0 0 62 62">
        <circle class="ring-bg"  cx="31" cy="31" r="25"/>
        <circle class="ring-arc" cx="31" cy="31" r="25"
                stroke-dasharray="157.1" stroke-dashoffset="157.1" id="ringArc"/>
      </svg>
      <div class="ring-num" id="ringNum">—</div>
    </div>
    <div class="controls">
      <select class="pattern-sel" id="patternSel" onchange="onPatternChange()">
        <option value="4-4-4-4">Box Breathing · 4-4-4-4</option>
        <option value="4-7-8-0">4-7-8 Relaxation</option>
        <option value="5-5-5-5">Extended Box · 5-5-5-5</option>
        <option value="6-0-6-0">Simple · 6-0-6-0</option>
      </select>
      <button class="btn-start" id="startBtn" onclick="toggleStart()">Begin</button>
    </div>
  </div>
  <div class="complete-msg" id="completeMsg"></div>
</div>

<script>
// ═══════════════════════════════════════════════
//  STARFIELD  — full page canvas, 3 layers
// ═══════════════════════════════════════════════
(function(){
  var c = document.getElementById('starCanvas');
  var ctx = c.getContext('2d');
  var W, H, stars = [];

  function resize(){ W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
  window.addEventListener('resize', function(){ resize(); build(); });
  resize();

  function build(){
    stars = [];
    for(var i=0;i<200;i++) push(Math.random()*.7+.15, Math.random()*.45+.05, [255,255,255], Math.random()*.5+.15, false);
    for(var i=0;i<70;i++){
      var col = Math.random()<.5 ? [190,210,255] : [255,248,200];
      push(Math.random()*1.1+.5, Math.random()*.55+.2, col, Math.random()*.35+.08, false);
    }
    for(var i=0;i<16;i++) push(Math.random()*1.6+1.1, Math.random()*.5+.5, [255,255,255], Math.random()*.2+.06, true);
  }
  function push(r,spd,col,ba,bright){
    stars.push({x:Math.random()*W,y:Math.random()*H,r:r,spd:spd,col:col,ba:ba,alpha:0,ph:Math.random()*Math.PI*2,bright:bright});
  }
  build();

  var t=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    t+=.012;
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.alpha = s.ba*(0.5+0.5*Math.sin(t*s.spd+s.ph));
      ctx.globalAlpha = Math.max(0,s.alpha);
      ctx.fillStyle='rgb('+s.col[0]+','+s.col[1]+','+s.col[2]+')';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      if(s.bright && s.alpha>.38){
        var len=s.r*4.5;
        ctx.globalAlpha=s.alpha*.35;
        ctx.strokeStyle='rgba('+s.col[0]+','+s.col[1]+','+s.col[2]+',1)';
        ctx.lineWidth=.5;
        ctx.beginPath(); ctx.moveTo(s.x-len,s.y); ctx.lineTo(s.x+len,s.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s.x,s.y-len); ctx.lineTo(s.x,s.y+len); ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();


// ═══════════════════════════════════════════════
//  MOON SCENE CANVAS
// ═══════════════════════════════════════════════
var mc  = document.getElementById('moonCanvas');
var ctx = mc.getContext('2d');
var DPR = window.devicePixelRatio || 1;
var CW  = 276, CH = 276;   // logical scene size

function resizeMoon(){
  var r = mc.getBoundingClientRect();
  mc.width  = r.width  * DPR;
  mc.height = r.height * DPR;
}
setTimeout(function(){ resizeMoon(); window.addEventListener('resize', resizeMoon); }, 60);

// Scene geometry
var SURF_Y  = CH * 0.72;   // moon surface y
var ASTRO_X = CW * 0.50;   // astronaut always centred horizontally
var EARTH_CX = CW * 0.72;  // Earth globe centre
var EARTH_CY = CH * 0.30;
var EARTH_R  = CH * 0.20;

// Craters on surface
var CRATERS = [
  {x:.12,y:.77,rx:.04,ry:.018},
  {x:.30,y:.80,rx:.055,ry:.022},
  {x:.52,y:.75,rx:.035,ry:.015},
  {x:.68,y:.79,rx:.06, ry:.025},
  {x:.84,y:.76,rx:.03, ry:.013},
  {x:.20,y:.86,rx:.025,ry:.010},
  {x:.60,y:.87,rx:.03, ry:.012},
];

// ── Draw full scene ──
function drawScene(phase, t) {
  if(!mc.width) return;
  var sw = mc.width/DPR, sh = mc.height/DPR;
  ctx.save();
  ctx.scale(DPR,DPR);

  // scale logical → canvas
  var sx = sw/CW, sy = sh/CH;
  ctx.scale(sx, sy);

  ctx.clearRect(0,0,CW,CH);

  drawBackground();
  drawEarth();
  drawSurface();
  drawAstronaut(phase, t);

  ctx.restore();
}

// ── Space background ──
function drawBackground(){
  var g = ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,   '#020510');
  g.addColorStop(0.55,'#060d28');
  g.addColorStop(1,   '#0c1535');
  ctx.fillStyle = g;
  ctx.beginPath();
  // clip to rounded rect
  roundedRect(0,0,CW,CH,28);
  ctx.fill();
}

// ── Earth ──
function drawEarth(){
  // Outer atmospheric glow
  var glow = ctx.createRadialGradient(EARTH_CX, EARTH_CY, EARTH_R*.6, EARTH_CX, EARTH_CY, EARTH_R*1.7);
  glow.addColorStop(0,   'rgba(60,140,255,0.18)');
  glow.addColorStop(0.5, 'rgba(30,80,200,0.08)');
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(EARTH_CX, EARTH_CY, EARTH_R*1.7, 0, Math.PI*2); ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(EARTH_CX, EARTH_CY, EARTH_R, 0, Math.PI*2); ctx.clip();

  // Ocean base
  var ocean = ctx.createRadialGradient(EARTH_CX-EARTH_R*.3, EARTH_CY-EARTH_R*.3, 0, EARTH_CX, EARTH_CY, EARTH_R);
  ocean.addColorStop(0,   '#4a9eff');
  ocean.addColorStop(0.4, '#1e6fd4');
  ocean.addColorStop(0.75,'#0d4aaa');
  ocean.addColorStop(1,   '#082a70');
  ctx.fillStyle = ocean;
  ctx.fillRect(EARTH_CX-EARTH_R, EARTH_CY-EARTH_R, EARTH_R*2, EARTH_R*2);

  // Landmasses (simplified continent shapes)
  ctx.fillStyle = '#3a8a50';
  // North America-ish
  ctx.beginPath();
  ctx.ellipse(EARTH_CX-EARTH_R*.38, EARTH_CY-EARTH_R*.15, EARTH_R*.22, EARTH_R*.30, -.3, 0, Math.PI*2);
  ctx.fill();
  // South America-ish
  ctx.beginPath();
  ctx.ellipse(EARTH_CX-EARTH_R*.22, EARTH_CY+EARTH_R*.28, EARTH_R*.12, EARTH_R*.22, .2, 0, Math.PI*2);
  ctx.fill();
  // Europe/Africa-ish
  ctx.beginPath();
  ctx.ellipse(EARTH_CX+EARTH_R*.08, EARTH_CY-.0, EARTH_R*.14, EARTH_R*.36, .1, 0, Math.PI*2);
  ctx.fill();
  // Asia-ish
  ctx.beginPath();
  ctx.ellipse(EARTH_CX+EARTH_R*.38, EARTH_CY-EARTH_R*.18, EARTH_R*.25, EARTH_R*.26, -.15, 0, Math.PI*2);
  ctx.fill();
  // Australia-ish
  ctx.beginPath();
  ctx.ellipse(EARTH_CX+EARTH_R*.40, EARTH_CY+EARTH_R*.32, EARTH_R*.11, EARTH_R*.09, .1, 0, Math.PI*2);
  ctx.fill();
  // Ice caps
  ctx.fillStyle = 'rgba(230,245,255,0.75)';
  ctx.beginPath(); ctx.ellipse(EARTH_CX, EARTH_CY-EARTH_R*.78, EARTH_R*.28, EARTH_R*.14, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(EARTH_CX, EARTH_CY+EARTH_R*.82, EARTH_R*.22, EARTH_R*.10, 0, 0, Math.PI*2); ctx.fill();

  // Cloud wisps
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath(); ctx.ellipse(EARTH_CX-EARTH_R*.1, EARTH_CY-EARTH_R*.42, EARTH_R*.3, EARTH_R*.07, -.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(EARTH_CX+EARTH_R*.2, EARTH_CY+EARTH_R*.12, EARTH_R*.25, EARTH_R*.06, .3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(EARTH_CX-EARTH_R*.3, EARTH_CY+EARTH_R*.35, EARTH_R*.2, EARTH_R*.055, .1, 0, Math.PI*2); ctx.fill();

  // Terminator shadow (right side)
  var shadow = ctx.createRadialGradient(EARTH_CX+EARTH_R*.7, EARTH_CY, 0, EARTH_CX+EARTH_R*.5, EARTH_CY, EARTH_R*1.1);
  shadow.addColorStop(0,   'rgba(2,5,20,0)');
  shadow.addColorStop(0.55,'rgba(2,5,20,0.15)');
  shadow.addColorStop(1,   'rgba(2,5,20,0.65)');
  ctx.fillStyle = shadow;
  ctx.fillRect(EARTH_CX-EARTH_R, EARTH_CY-EARTH_R, EARTH_R*2, EARTH_R*2);

  // Atmosphere rim glow
  ctx.restore();
  ctx.strokeStyle = 'rgba(80,170,255,0.55)';
  ctx.lineWidth = EARTH_R*.06;
  ctx.beginPath(); ctx.arc(EARTH_CX, EARTH_CY, EARTH_R, 0, Math.PI*2); ctx.stroke();

  // Specular highlight
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.ellipse(EARTH_CX-EARTH_R*.3, EARTH_CY-EARTH_R*.3, EARTH_R*.3, EARTH_R*.18, -.5, 0, Math.PI*2); ctx.fill();
}

// ── Moon surface ──
function drawSurface(){
  // Far ridgeline
  ctx.fillStyle = 'rgba(50,70,130,0.5)';
  ctx.beginPath(); ctx.moveTo(0, SURF_Y+2);
  var ridge=[
    [0,SURF_Y+2],[18,SURF_Y-9],[45,SURF_Y-20],[72,SURF_Y-8],
    [100,SURF_Y-24],[128,SURF_Y-13],[158,SURF_Y-21],[190,SURF_Y-7],
    [218,SURF_Y-17],[248,SURF_Y-4],[276,SURF_Y+2]
  ];
  for(var i=0;i<ridge.length;i++) ctx.lineTo(ridge[i][0],ridge[i][1]);
  ctx.lineTo(CW,CH); ctx.lineTo(0,CH); ctx.closePath(); ctx.fill();

  // Main surface
  var sg = ctx.createLinearGradient(0,SURF_Y,0,CH);
  sg.addColorStop(0,   '#8fa4c8');
  sg.addColorStop(0.07,'#6880a8');
  sg.addColorStop(0.3, '#3a5080');
  sg.addColorStop(1,   '#18264a');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.moveTo(0, SURF_Y);
  ctx.bezierCurveTo(70,SURF_Y-3, 140,SURF_Y+4, CW,SURF_Y-1);
  ctx.lineTo(CW,CH); ctx.lineTo(0,CH); ctx.closePath(); ctx.fill();

  // Surface highlight line
  ctx.strokeStyle = 'rgba(180,210,255,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,SURF_Y);
  ctx.bezierCurveTo(70,SURF_Y-3, 140,SURF_Y+4, CW,SURF_Y-1);
  ctx.stroke();

  // Craters
  for(var i=0;i<CRATERS.length;i++){
    var cr = CRATERS[i];
    var cx2=cr.x*CW, cy2=cr.y*CH, rx=cr.rx*CW, ry=cr.ry*CH;
    var cg = ctx.createRadialGradient(cx2-rx*.3,cy2,0,cx2,cy2,rx);
    cg.addColorStop(0,   'rgba(15,30,80,0.55)');
    cg.addColorStop(0.7, 'rgba(50,75,140,0.25)');
    cg.addColorStop(1,   'rgba(50,75,140,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.ellipse(cx2,cy2,rx,ry,0,0,Math.PI*2); ctx.fill();
    // rim highlight
    ctx.strokeStyle = 'rgba(180,210,255,0.18)';
    ctx.lineWidth = .7;
    ctx.beginPath(); ctx.ellipse(cx2,cy2-ry*.2,rx*.9,ry*.5,0,Math.PI,Math.PI*2); ctx.stroke();
  }
}

// ── Astronaut bounding ──
// Phase 0 = Inhale  → jump UP (ascending arc)
// Phase 1 = Hold    → floating at apex (slight drift)
// Phase 2 = Exhale  → descend back to surface
// Phase 3 = Hold    → standing on surface (feet planted, gentle sway)

var JUMP_HEIGHT = CH * 0.30;  // how high above surface at apex
var ASTRO_FOOT  = SURF_Y;     // y where feet touch ground

function getAstroY(phase, t) {
  var eased = easeInOut(t);
  if(phase === 0) {
    // Inhale: rise from surface to apex (ease-in upward)
    return ASTRO_FOOT - JUMP_HEIGHT * eased;
  } else if(phase === 1) {
    // Hold at top: gentle slow drift ±3px
    return ASTRO_FOOT - JUMP_HEIGHT + Math.sin(t * Math.PI) * 3;
  } else if(phase === 2) {
    // Exhale: descend from apex to surface (ease-out downward)
    return ASTRO_FOOT - JUMP_HEIGHT * (1 - eased);
  } else {
    // Hold on ground: tiny settle bounce
    var settle = Math.abs(Math.sin(t * Math.PI * 1.5)) * 2.5 * (1 - t*.7);
    return ASTRO_FOOT + settle;
  }
}

function drawAstronaut(phase, t) {
  var astroY = getAstroY(phase, t);
  var onGround = (phase === 3);
  var atApex   = (phase === 1);
  var rising   = (phase === 0);
  var falling  = (phase === 2);

  // Airborne = any phase except 3 where not yet touching
  var airborne = (astroY < ASTRO_FOOT - 3);

  // Shadow on surface (shrinks/fades as astronaut rises)
  var shadowScale = Math.max(0, 1 - (ASTRO_FOOT - astroY) / JUMP_HEIGHT);
  ctx.fillStyle = 'rgba(8,18,55,'+(0.4*shadowScale)+')';
  ctx.beginPath();
  ctx.ellipse(ASTRO_X, ASTRO_FOOT+2, 16*shadowScale+4, 3.5*shadowScale+1, 0, 0, Math.PI*2);
  ctx.fill();

  // Dust puff on takeoff (phase 0, early t) and landing (phase 3, early t)
  if(phase===0 && t<0.25) drawDust(ASTRO_X, ASTRO_FOOT, t/0.25);
  if(phase===3 && t<0.2)  drawDust(ASTRO_X, ASTRO_FOOT, (0.2-t)/0.2);

  ctx.save();
  ctx.translate(ASTRO_X, astroY);

  // Slight body tilt on rising/falling
  var tilt = 0;
  if(rising)  tilt =  Math.sin(easeInOut(t)*Math.PI) * 6;   // lean forward on rise
  if(falling) tilt = -Math.sin(easeInOut(t)*Math.PI) * 4;   // lean back on fall
  ctx.rotate(tilt * Math.PI/180);

  // Leg spread: tucked when airborne, planted when grounded
  var legSpread  = airborne ? 10 : 4;
  var legBend    = airborne ? 18 : 0;   // knee bend angle
  var armSpread  = airborne ? 22 : 8;   // arms out for balance

  // At apex: maximum tuck
  if(atApex){ legSpread=14; legBend=28; armSpread=30; }

  drawFigure(ctx, legSpread, legBend, armSpread, onGround, phase, t);
  ctx.restore();
}

function drawDust(x, y, strength){
  if(strength<=0) return;
  ctx.save();
  for(var i=-3;i<=3;i++){
    var px = x + i*9 + (Math.random()-.5)*4;
    var py = y - Math.abs(i)*2 - strength*8;
    var pr = (1.5 + Math.abs(i)*.6) * strength;
    ctx.globalAlpha = strength * 0.35 * (1-Math.abs(i)/4);
    ctx.fillStyle = 'rgba(150,175,220,1)';
    ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawFigure(ctx, legSpread, legBend, armSpread, onGround, phase, t) {
  // All coords relative to (0,0) = astronaut foot-centre point

  var lx = -legSpread/2;   // left foot x
  var rx =  legSpread/2;   // right foot x
  var ky = -20;             // knee y
  var hipY = -24;           // hip y
  var waistY = -32;
  var shoulderY = -42;
  var headY = -54;

  // ── Back leg (draw first) ──
  ctx.save();
  ctx.globalAlpha = 0.75;
  drawLeg(ctx, -rx, hipY, -rx*0.6, ky-legBend, rx*.4, -2, '#8aaac8','#6080a0');
  ctx.restore();

  // ── Back arm ──
  ctx.save();
  ctx.globalAlpha = 0.72;
  drawArm(ctx, armSpread, shoulderY, '#a8c4e0','#7898b8');
  ctx.restore();

  // ── Legs ──
  drawLeg(ctx,  lx, hipY,  lx*0.5, ky-legBend, -rx*.3, -2, '#c0d4ee','#8aaac8');
  drawLeg(ctx,  rx, hipY,  rx*0.5, ky-legBend,  lx*.3, -2, '#c0d4ee','#8aaac8');

  // ── Torso ──
  var tg = ctx.createLinearGradient(-11, waistY, 11, shoulderY);
  tg.addColorStop(0,   '#dce8ff');
  tg.addColorStop(0.5, '#c8d8f2');
  tg.addColorStop(1,   '#aabfe0');
  ctx.fillStyle = tg;
  ctx.strokeStyle = '#8aaad0'; ctx.lineWidth=.8;
  ctx.beginPath(); roundedRect(-11, waistY, 22, Math.abs(waistY-shoulderY)+4, 5);
  ctx.fill(); ctx.stroke();

  // Chest panel
  ctx.fillStyle='rgba(80,130,210,0.28)';
  ctx.beginPath(); roundedRect(-7, shoulderY+5, 14, 8, 3); ctx.fill();
  // Indicator dots
  var dots=[['#7eb8ff',-4],['#ff9a6c',0],['#90ee90',4]];
  for(var d=0;d<dots.length;d++){
    ctx.fillStyle=dots[d][0];
    ctx.beginPath(); ctx.arc(dots[d][1], shoulderY+10, 1.4, 0, Math.PI*2); ctx.fill();
  }

  // Backpack
  ctx.fillStyle='#7a9cc0'; ctx.strokeStyle='#5a7a9a'; ctx.lineWidth=.6;
  ctx.beginPath(); roundedRect(10, shoulderY+2, 5, 10, 2); ctx.fill(); ctx.stroke();

  // ── Front arm ──
  drawArm(ctx, -armSpread, shoulderY, '#c0d4ee','#8aaac8');

  // ── Helmet ──
  // Neck ring
  ctx.fillStyle='#90b0d0';
  ctx.beginPath(); ctx.ellipse(0, shoulderY+1, 7, 3, 0, 0, Math.PI*2); ctx.fill();

  // Globe
  var hg = ctx.createRadialGradient(-3, headY-4, 1, 0, headY, 12);
  hg.addColorStop(0,   '#eaf2ff');
  hg.addColorStop(0.45,'#c8d8f5');
  hg.addColorStop(1,   '#7a9ad8');
  ctx.fillStyle=hg; ctx.strokeStyle='#6a88c8'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0, headY, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  // Visor
  var vg = ctx.createLinearGradient(-7, headY-6, 6, headY+4);
  vg.addColorStop(0,   'rgba(70,130,220,0.92)');
  vg.addColorStop(0.6, 'rgba(30,90,190,0.88)');
  vg.addColorStop(1,   'rgba(15,55,155,0.92)');
  ctx.fillStyle=vg;
  ctx.beginPath(); ctx.ellipse(0, headY, 8, 7, 0, 0, Math.PI*2); ctx.fill();

  // Visor reflections
  ctx.fillStyle='rgba(255,255,255,0.48)';
  ctx.beginPath(); ctx.ellipse(-3.5, headY-3.5, 2.8, 1.6, -.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.beginPath(); ctx.ellipse(2, headY, 1.5, 1, .3, 0, Math.PI*2); ctx.fill();

  // Helmet rim
  ctx.strokeStyle='rgba(150,195,255,0.55)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0, headY, 12, 0, Math.PI*2); ctx.stroke();

  // Tether cable when airborne (floats behind)
  if(phase!==3){
    ctx.save();
    ctx.strokeStyle='rgba(160,190,230,0.3)';
    ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    ctx.beginPath();
    ctx.moveTo(0, 0);  // foot anchor
    var slack = 8 + Math.sin(t*Math.PI)*6;
    ctx.quadraticCurveTo(slack*2, -10, 0, waistY+4);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawLeg(ctx, fx, hy, kx, ky, tx, ty, fill, stroke){
  // Hip → knee → foot (two segments)
  ctx.strokeStyle = stroke; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,hy); ctx.lineTo(kx,ky); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(kx,ky); ctx.lineTo(fx,ty); ctx.stroke();
  // Boot
  ctx.fillStyle=fill; ctx.strokeStyle=stroke; ctx.lineWidth=.8;
  ctx.beginPath(); ctx.ellipse(fx, ty, 6, 3.5, -.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // Suit leg overlay
  ctx.strokeStyle = fill; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,hy); ctx.lineTo(kx,ky); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(kx,ky); ctx.lineTo(fx,ty); ctx.stroke();
}

function drawArm(ctx, spread, shoulderY, fill, stroke){
  var side = spread > 0 ? 1 : -1;
  ctx.strokeStyle=stroke; ctx.lineWidth=5; ctx.lineCap='round';
  // upper arm
  ctx.beginPath(); ctx.moveTo(side*10, shoulderY+5); ctx.lineTo(side*14+spread*.3, shoulderY+12); ctx.stroke();
  // forearm
  ctx.beginPath(); ctx.moveTo(side*14+spread*.3, shoulderY+12); ctx.lineTo(spread*.8, shoulderY+18); ctx.stroke();
  // sleeve overlay
  ctx.strokeStyle=fill; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.moveTo(side*10, shoulderY+5); ctx.lineTo(side*14+spread*.3, shoulderY+12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(side*14+spread*.3, shoulderY+12); ctx.lineTo(spread*.8, shoulderY+18); ctx.stroke();
  // glove
  ctx.fillStyle='#5a78a8';
  ctx.beginPath(); ctx.arc(spread*.8, shoulderY+18, 3.5, 0, Math.PI*2); ctx.fill();
}

function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function easeInOut(t){ return t<.5 ? 2*t*t : -1+(4-2*t)*t; }


// ═══════════════════════════════════════════════
//  BREATHING ENGINE
// ═══════════════════════════════════════════════
var PATTERNS = {
  '4-4-4-4':[4,4,4,4], '4-7-8-0':[4,7,8,0],
  '5-5-5-5':[5,5,5,5], '6-0-6-0':[6,0,6,0]
};
var CAPTIONS = ['Breathe in…','Hold…','Release slowly…','Rest…'];
var MAX_CYCLES = 8;

var pattern=[4,4,4,4], running=false, cycleCount=0, cycleElapsed=0;
var totalMs=16000, lastTs=null, raf=null;

// SVG trace
var traceRect = document.getElementById('traceRect');
var traceLen;
(function(){
  var svg=document.getElementById('boxSvg');
  var tmp=document.createElementNS('http://www.w3.org/2000/svg','path');
  tmp.setAttribute('d','M42,8 H258 Q292,8 292,42 V258 Q292,292 258,292 H42 Q8,292 8,258 V42 Q8,8 42,8 Z');
  svg.appendChild(tmp); traceLen=tmp.getTotalLength(); svg.removeChild(tmp);
  traceRect.style.strokeDasharray=traceLen;
  traceRect.style.strokeDashoffset=traceLen;
})();

var ringArc=document.getElementById('ringArc');
var RING_C=157.1;

function computeMs(){ totalMs=pattern.reduce(function(a,b){return a+b;},0)*1000; }

function getPhase(ms){
  var acc=0;
  for(var i=0;i<4;i++){
    var d=pattern[i]*1000;
    if(d>0 && ms<acc+d) return {ph:i,start:acc,dur:d};
    acc+=d;
  }
  return {ph:3,start:acc,dur:1};
}

function tick(ts){
  if(!running) return;
  if(!lastTs) lastTs=ts;
  var dt=Math.min(ts-lastTs,120); lastTs=ts;
  cycleElapsed+=dt;
  if(cycleElapsed>=totalMs){
    cycleElapsed-=totalMs; cycleCount++;
    if(cycleCount>=MAX_CYCLES){ finish(); return; }
  }
  var info=getPhase(cycleElapsed);
  var t=Math.min((cycleElapsed-info.start)/info.dur, 1);
  var secLeft=Math.max(0,(info.dur-(cycleElapsed-info.start))/1000);

  traceRect.style.strokeDashoffset = traceLen*(1-cycleElapsed/totalMs);
  for(var i=0;i<4;i++) document.getElementById('sl'+i).classList.toggle('lit',i===info.ph);
  document.getElementById('phaseLabel').textContent = CAPTIONS[info.ph];
  ringArc.style.strokeDashoffset = RING_C*(1-t);
  document.getElementById('ringNum').textContent = Math.ceil(secLeft);

  drawScene(info.ph, t);
  raf=requestAnimationFrame(tick);
}

function finish(){
  running=false; if(raf) cancelAnimationFrame(raf); raf=null; lastTs=null;
  document.getElementById('startBtn').textContent='Begin Again';
  document.getElementById('phaseLabel').textContent='Well done ✦';
  document.getElementById('completeMsg').textContent=cycleCount+' cycles complete · rest in the quiet 🌙';
  traceRect.style.strokeDashoffset=traceLen;
  for(var i=0;i<4;i++) document.getElementById('sl'+i).classList.remove('lit');
  drawScene(3,1);
}

function toggleStart(){
  if(running){
    running=false; if(raf) cancelAnimationFrame(raf); raf=null; lastTs=null;
    document.getElementById('startBtn').textContent='Resume';
    document.getElementById('phaseLabel').textContent='Paused…';
  } else {
    if(cycleCount>=MAX_CYCLES){ cycleCount=0; cycleElapsed=0; document.getElementById('completeMsg').textContent=''; }
    running=true; lastTs=null;
    document.getElementById('startBtn').textContent='Pause';
    document.getElementById('completeMsg').textContent='';
    raf=requestAnimationFrame(tick);
  }
}

function onPatternChange(){
  var v=document.getElementById('patternSel').value;
  pattern=PATTERNS[v]; computeMs(); cycleElapsed=0;
  if(!running){
    traceRect.style.strokeDashoffset=traceLen;
    document.getElementById('phaseLabel').textContent='Ready to begin';
    document.getElementById('ringNum').textContent='—';
    drawScene(3,0);
  }
}

// ── Idle draw loop (before start) ──
computeMs();
var idleT=0;
function idleDraw(){
  if(running) return;
  idleT+=0.006;
  drawScene(3, (Math.sin(idleT)+1)/2);
  requestAnimationFrame(idleDraw);
}
setTimeout(function(){ resizeMoon(); idleDraw(); }, 100);
</script>
